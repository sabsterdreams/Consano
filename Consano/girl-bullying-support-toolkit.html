      /* Ensure full width and no overflow clipping */
      body {
        font-family: 'Open Sans', sans-serif;
        color: #534b4a;
        margin: 0;
        padding: 0;
        width: 100%;
      }

      .page-title {
        font-family: 'Playfair Display', serif;
        text-align: center;
        margin: 30px 0 20px 0;
        color: #534b4a;
      }

      /* CSS Grid Layout: Guarantees 3-4 columns on desktop/laptop */
      .pin-container {
        display: grid;
        /* Set minimum card width to 220px; fits 3 to 4 cards on most laptop screens */
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        width: 92%;
        max-width: 1300px;
        margin: 0 auto 40px auto;
      }

      /* Tile Card Styling */
      .pin-card {
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(83, 75, 74, 0.08);
        border: 1px solid rgba(83, 75, 74, 0.05);
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .pin-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(83, 75, 74, 0.12);
      }

      /* Top Accent Line & Image */
      .pin-image-wrapper {
        width: 100%;
        border-top: 3px solid #ffd4ce;
        overflow: hidden;
      }

      .pin-card img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      /* Content Area */
      .pin-content {
        padding: 14px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .pin-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.1rem;
        font-weight: 700;
        line-height: 1.3;
        margin: 0 0 8px 0;
        color: #534b4a;
      }

      .pin-title a {
        color: inherit;
        text-decoration: none;
      }

      .pin-title a:hover {
        border-bottom: 2px solid #ffd4ce;
      }

      .pin-excerpt {
        font-size: 0.85rem;
        line-height: 1.45;
        margin: 0 0 14px 0;
        color: #534b4a;
        opacity: 0.9;
        flex-grow: 1;
      }

      /* Accent Button */
      .pin-btn {
        display: inline-block;
        align-self: flex-start;
        background-color: #ffd4ce;
        color: #534b4a;
        font-weight: 600;
        font-size: 0.78rem;
        padding: 6px 14px;
        border-radius: 20px;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .pin-btn:hover {
        background-color: #f7bebe;
      }
    </style>
